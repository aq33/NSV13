2024-09-06:
  Bokkiewokkie:
    - tweak: Changed asteroid ore spawning to respect asteroid maps more
  DeltaFire15:
    - bugfix: Possibly fixes some weird Sabre behavior.
    - bugfix: Also makes one single gun check of the plasma caster slightly safer.
    - bugfix: Fixes a weird edge case with docking behavior.
    - bugfix: Fixes remove_ship() assuming all remove_ship() calls were FTL based.
    - bugfix: >-
        Overmap objects when deleting have remove_ship() called for them (this
        should mostly only affect z carriers which drop their z or pass it to
        another ship).
    - bugfix: Overmap objects that are deleted now drop their current_system var.
2024-09-13:
  DeltaFire15:
    - bugfix: >-
        Pylon-related things should no longer brick if the Pylon is destroyed
        due to high waste pressure.
    - bugfix: Some advanced soundloop stuff might probably work better now.
    - balance: >-
        Lizards are now coldblooded (they have no natural bodytemperature
        stabilization besides the environment).
    - balance: >-
        Coldblooded creatures also have an inefficient form of thermogenesis
        they can use to heat up.
    - balance: >-
        Lizards dislike the cold (<15°C / when you start shivering) and like
        warmth (30°C-60°C), which can affect mood.
    - balance: Lizards no longer have a 1.5 cold damage modifier.
    - balance: >-
        Having somebody in an aggressive grab will share temperature between the
        grabber and grabbed target over time (respecting insulation).
    - balance: Drinking blood as a moth now has a weaker mood buff.
    - balance: Naval coffee now has a weaker mood buff.
    - bugfix: >-
        Temperature protection values returned by the getter are no longer very
        very slightly off the value they should be. Thanks decimal precision.
2024-09-26:
  Bokkiewokkie:
    - rscadd: Added space mines
  DeltaFire15:
    - bugfix: The NSV-specific achievements should work now.
    - rscadd: Some more NSV-specific achievements.
    - bugfix: Replaced a dist call for overmap singularities with the proper version.
  SerynEngi and BluHNT:
    - rscadd: Added new MAA hardsuit sprite
    - balance: made MAA hardsuit less weapon-resistant in exchange for more speed.
