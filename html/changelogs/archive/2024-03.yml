2024-03-29:
  Bobbanz1:
    - bugfix: >-
        The destruction of a gauss turret now leaves behind the machine frame
        that had been used to construct it.
    - code_imp: >-
        Gave the machine board of the gauss turret a req_components list with
        nothing inside it to prevent a runtime error from occurring.
    - tweak: >-
        Rerouted the piping network in the assault course a bit so it resolves
        the issue raised about them missing when they were actually going
        through the window instead.
    - rscdel: Removed some wiring that didn't do anything.
    - bugfix: >-
        Engineering Lobby now has the wiring coming from maintenance actually
        hooked up to the grid rather than ending a tile early.
    - rscadd: >-
        Gave the Aetherwhisp laser weaponry circuit boards so they don't get
        completely round removed when destroyed,
