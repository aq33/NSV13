'2024-12-06':
  DeltaFire15:
  - code_imp: Ship interior loading now uses a queue system (for virtual z using things
      like Sabres & Asteroids)
  - code_imp: Some overmap z generation handling is ever so slightly cleaner now.
  - bugfix: Should resolve certain atom init issues (that manifested as broken sparks,
      among many other things).
'2024-12-17':
  Bokkiewokkie:
  - rscadd: Added knpcs to the ghost orbit menu under the npc section
  - balance: made knpcs take actions a bit slower
  - bugfix: fixed inflatable walls not having a range check on their deployment
  - code_imp: made knpcs use human procs instead of forcemoving things around constantly
  - refactor: refactored knpc climbing
  DeltaFire15:
  - code_imp: Singularities now use system contents in a safe way.
  - bugfix: Spawn_ship no longer floods system_contents with typepaths.
  - bugfix: Overmap firing should be a bit more resilient to turf-related oddities.
'2024-12-18':
  Bokkiewokkie:
  - rscadd: Added more viewscreens in Tycoon's departments.
  - bugfix: Removed pool ladders from Atlas dorms.
  - bugfix: Fixed the Tycoon engineering security outpost not starting connected.
'2024-12-27':
  Bokkiewokkie:
  - rscadd: Added a peculiar effect when an unreasonable amount of energy hits a singularity
      generator.
  - admin: Added admin logging for BSA misfire incidents
  - tweak: Gave fighter engines a tooltip when they are flooded
  DeltaFire15:
  - bugfix: Space tiles on midround-created overmap zlevels should behave normally
      again.
  - bugfix: Foam no longer persists infinitely when combined with hulljuice / firefoam
      (diminishing returns)
  - balance: Cooking Oil contact damage is now lower / more reasonable (I consider
      that one a bug for reasons I am not going into detail on)
  - bugfix: Love potions do not work on knpcs. (They feel no love)
  - bugfix: Several repair sources that bypassed the point of no return no longer
      do so.
  - bugfix: Several AI-related overmap checks should now be more sane (especially
      not being weird if not on an overmap).
  - bugfix: AIs no longer die if the exosuit that is being remote controlled is destroyed.
      They flash-sever the connection instead. (Assuming core exists and you used
      a beacon, not the malf override)
  - balance: To balance out AIs no longer immediately dying if they do not disconnect
      from a mech early, they now take 33% of maximum integrity in feedback damage
      if forcibly disconnected from a mech (via destruction). This should preserve
      at least some involvement in making the decision to disconnect.
  - bugfix: AI camera networks should behave a LOT better while remote controlling
      mechs, ESPECIALLY when taking them to other z levels, fixing a plethora of related
      bugs (mostly related to static, equipment usage, and so on).
  - bugfix: You can no longer set ships to autopilot which never were AI controlled
      in the first place.
  - bugfix: Sabres & Fighters can't buy things from stations anymore (Do it from a
      big ship instead)
  - bugfix: You cannot make Sabres / Fighters within another small craft. Use your
      time more wisely.
  - bugfix: The astrometrics sensors no longer pierce bluespace into other sectors
      (You'll have to be there to scan those)
  - bugfix: Pool ladders can no longer be built infinitely because somebody forgot
      their doafter mistrust.
  - code_imp: Reworked a bunch of NAC code, especially around linkages, bad typing,
      unsafe stuff.. and so on.
  - bugfix: NAC cores no longer preserve linkage when unanchored.
  - bugfix: NAC machines no longer preserve linkage when unanchored (at least most
      of them).
  - bugfix: NAC machines can no longer be single-tile stacked (and work) (at least
      most of them).
  - bugfix: NAC machines can no longer be multilinked to several NACs (at least most
      of them).
  - bugfix: NAC machines should now behave better when being destroyed (code-wise).
  - tweak: NAC cores now tell you what is wrong during linkage.
  - tweak: A bunch of maps had their munitions cores changed due to the retyping of
      them I did because their type was very very bad.
  - code_imp: take_quadrant_damage doesn't discard damage anymore if the ship has
      no quadrants (and just goes directly to take_damage)
  ? Various TG coders from multiple PRs (AnturK, Thunder12345, Fikou, Y0SH1M4S73R,
    Ryll/Shaps, MrStonedOne, LemonInTheDark, ninjanomnom) - port by EvilDragonfiend
  : - bugfix: Datums and lists used as keys in assoc lists are now linked in vv
    - rscadd: View variables can now accept input from a colour picker.
    - code_imp: Changed resolve weakref vv option to TG version
    - admin: infinity option is added to vv classes
    - admin: Added the color matrix editor. It is available from a dropdown option
        in an atom's View Variables menu as well as when editing an existing color
        matrix.
    - admin: Added Datum Tagging, a new admin tool for quickly marking and referring
        back to various datums and atoms. You can tag atoms by ctrl+middle clicking
        them or using the right click context menu, or from their VV dropdown menu
        (especially for abstract datums that can't be clicked).
    - admin: The View-Tags menu can quickly be accessed by F9 default, or using the
        View-Tags button at the bottom of the Admin -> Game status panel section.
    - admin: Tagged datums can also be referenced for things like proccalls and VV
        var edits, similarly to Marked objects.
    - code_imp: Fixup list helpers, remove listoflist footgun from generic list procs,
        remove duplicated procs
    - admin: VV for global vars will now load MUCH faster, in exchange lists are now
        perma contracted in that particular pane
    - admin: Appearance vars in VV now display instead of being left blank
    - bugfix: Fixes passing in list arguments in callproc
    - admin: VV can now display the contents of special byond lists like filters,
        or client.images
    - admin: VV on images now displays the image in the header
    - admin: VV can now display filters and includes their type
    - code_imp: Precalculates special list var names and avoids incorrect vv targets
