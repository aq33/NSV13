'2024-05-03':
  Bokkiewokkie:
  - bugfix: Fixed fighters not hearing overmap messages from their mothership.
  - spellcheck: Made it clear the Syndicate Crew antag preference is for PVP
  DeltaFire15:
  - balance: The BSA now goes kaboom when relayed instead of being essentially a ghost
      NAC shell.
  - bugfix: The Eclipse no longer spawns a borg module that should never exist outside
      of mobs.
  - bugfix: DNA no longer has some super weird code for flavor text, instead copying
      the one of the source mob.
  - tweak: You can no longer stack interactions on walls. This is to prevent a runtime
      from actions that modify the type of them (deconstruction mainly).
  - bugfix: Paper no longer runtimes if you do not have a pen in hand (???).
  - bugfix: Traders no longer do some cursed things to create their trade items, instead
      using the all-powerful initial().
  - bugfix: The stormdrive no longer runtimes if it has zero gas in it.
  - bugfix: Some squad assignment stuff shouldn't try to use a list as datum anymore.
'2024-05-14':
  tonty:
  - bugfix: the FTL navigation console no longer grants hyperspecific telekinesis
      to people who use it
'2024-05-17':
  itsmeow:
  - rscadd: Added TGUI-Say (can be disabled in prefs, light theme also in prefs) -
      Tab to switch channels.
  - rscadd: Added new TGUI Say keybinds - Y for Radio, L for LOOC (not currently rebindable).
  - rscadd: Added TGUI input preferences (mostly unused currently).
  - rscadd: Added glorfing to TGUI-Say - if you get hit hard enough, your message
      will be cut off with "-OW!!!", "-AUGH!!!", "-GLORF!!" or similar.
  - admin: Added logging to typing indicators.
  - rscadd: Added OOC Verb "Refresh TGUI".
  - tweak: Legacy say hotkey macros (Ctrl+T, Ctrl+O) have been replaced with T and
      O.
'2024-05-19':
  DeltaFire15:
  - bugfix: Brooms can no longer bluespace things into space.
  - rscadd: The gravity generator now has an emag interaction (and a method to fix
      said interaction).
  - bugfix: Overmap projectiles should no longer runtime during collisions while in
      the process of being fired.
  - bugfix: Explosions no longer try to throw qdeleting objects.
  - bugfix: The admin ghost checking proc no longer cries if it is passed a non-mob.
  - bugfix: The ship console references on overmaps now have some slightly more sane
      reference handling.
  someone543:
  - tweak: Galactica dropship hangar tube was made one tile wider, blast doors have
      been replaced with airlocks, and a tug has been added
  - bugfix: Galactica dropship can now move from it's starting location
  - bugfix: Flight leader now has the right icon
'2024-05-21':
  Haliris, BriggsIDP, Powerfulbacon, TsunamiAnt, PestoVerde322:
  - rscadd: Added workshop area to brig based on the holodeck code, where prisoners
      can make donuts or plushes and scan them to get reduced sentences. Adds secure
      floors and prison grilles to help secure the prison area better. Adds crafting
      method for plushes to support the prison plushes sweatshop.
  - rscadd: Added genpop workshops to Hammerhead and Gladius
  - tweak: Changed the path of the previous prisoner id used for gulag (now id/gulag).
      Updated paths of the current holodeck templates to holodeck/recreational to
      allow for easier subtypes implementation. Removed holographic flag preventing
      the crafting menu from working.
  - tweak: Genpop code and icons moved out of nsv13 folder
'2024-05-31':
  DeltaFire15:
  - code_imp: Slightly improved some ui_acts of Fighters, APNP and APNW.
  Ikalpo:
  - rscadd: Conveyor switch assemblies keep all their settings, which can be changed
      using tools
  - rscadd: Conveyor switch assemblies can get a link from a belt
  - rscadd: Conveyor switches can be renamed
  - bugfix: Slow conveyor belts no longer stack with normal ones
  - imageadd: Slow belts are now yellow
  benbot16:
  - rscadd: Ammo racks may now be loaded by attacking them with ammunition
  - tweak: Jam SFX now plays on jam instead of on load attempt
  - bugfix: Fixes a few ammo rack-related edge cases
