2024-01-13:
  Bokkiewokkie:
    - rscadd: >-
        Added the option to get another ticket objective if Rubicon is already
        cleared
    - tweak: Increased Rubicon objective player requirement to 10
    - tweak: Mission briefing names will now be consistent in a round
    - balance: Fleets will now be stronger after the main mission is done
    - admin: Added button to hide/unhide a system on the starsystem manager
    - admin: Automatically unhides systems selected for the "clear system" objective
  DeltaFire15:
    - rscadd: >-
        Overmap singularities now have more impactful effects, including but not
        limited to increased gravity inside nearby vessels, dampener
        interference, and improved directional pull.
    - rscadd: >-
        Full hardsuits now provide 1G gravity protection against damage, though
        they do not improve movement.
    - balance: >-
        Silicons will suffer from consistently very high gravity, starting at
        above 8G.
    - tweak: >-
        Some interactions with high gravity previously limited to grav-sensitive
        individuals now are accessible to anyone, albeit at lower magnitude
        (generally 3G higher tolerance)
    - bugfix: Starsystem persistence should now be slightly less volatile.
    - config: >-
        The starsystem persistence config MUST be reset to the default starmap
        for the fixes in this PR to apply correctly.
  covertcorvid:
    - bugfix: fixed the database query for the round endings
