2023-06-21:
  4310V343k:
    - bugfix: buying an extra charslot for torps now unlocks it immediately
  ExcessiveUseOfCobblestone, Mothblocks:
    - rscdel: Removed the Surgery Drapes from the Debug Omnitool.
