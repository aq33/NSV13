2023-06-27:
  Bokkiewokkie:
    - rscadd: 'Added a new overmap objective: scanning anomalies!'
    - balance: lowered the amount of required jumps for the FTL jump objective by 2-3
    - code_imp: added global anomaly list
    - code_imp: >-
        added get_by_type and get_atom_by_type procs to get a type of object
        from a lists
    - code_imp: >-
        scanned anomalies are now stored per overmap instead of per astrometrics
        console
    - code_imp: >-
        anomalies now store their current system in a variable like ships, and
        can be located with find_system()
