name: Make changelogs

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  MakeCL:
    runs-on: ubuntu-latest
    # if: github.repository == 'BeeStation/NSV13' && !contains(github.event.head_commit.message, '[ci skip]')
    steps:
      - name: Checkout
        uses: actions/checkout@v1
        with:
          fetch-depth: 25
      - name: Python setup
        uses: actions/setup-python@v1
        with:
          python-version: "3.11"
      - name: Install depends
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/changelog/requirements.txt
      - name: Make CL
        env:
          # Falls back to the workflow token when the BeeStation bot PAT isn't configured (it isn't on this fork)
          GITHUB_TOKEN: ${{ secrets.BEEBOT_PAT || secrets.GITHUB_TOKEN }}
          GIT_EMAIL: "56381746+ss13-beebot@users.noreply.github.com"
          GIT_NAME: "ss13-beebot"
        run: python tools/changelog/generate_cl.py
